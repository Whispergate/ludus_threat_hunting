---
- name: Install util-linux (flock)
  ansible.builtin.apt:
    name: util-linux
    state: present

- name: Install the RITA import script
  ansible.builtin.template:
    src: ludus-rita-import.sh.j2
    dest: /usr/local/bin/ludus-rita-import
    owner: root
    group: root
    mode: "0755"

- name: Install the RITA import service
  ansible.builtin.template:
    src: ludus-rita-import.service.j2
    dest: /etc/systemd/system/ludus-rita-import.service
    mode: "0644"
  notify: Reload systemd

- name: Install the RITA import timer
  ansible.builtin.template:
    src: ludus-rita-import.timer.j2
    dest: /etc/systemd/system/ludus-rita-import.timer
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the timer unit exists before it is enabled
  ansible.builtin.meta: flush_handlers

- name: Enable and start the RITA import timer
  ansible.builtin.systemd:
    name: ludus-rita-import.timer
    enabled: true
    state: started
    daemon_reload: true
