---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# `zeekctl deploy` is check + install + restart. It briefly drops capture, so
# it only runs when configuration actually changed.
- name: Deploy zeek
  ansible.builtin.command: "{{ ludus_threat_hunting_zeek_prefix }}/bin/zeekctl deploy"
  changed_when: true

- name: Restart zeek sensor iface
  ansible.builtin.systemd:
    name: zeek-sensor-iface.service
    state: restarted
    daemon_reload: true

- name: Restart mirror receiver
  ansible.builtin.systemd:
    name: zeek-mirror-receiver.service
    state: restarted
    daemon_reload: true

- name: Restart pcap receiver
  ansible.builtin.systemd:
    name: zeek-pcap-receiver.service
    state: restarted
    daemon_reload: true

- name: Restart mirror agent
  ansible.builtin.systemd:
    name: zeek-mirror-agent.service
    state: restarted
    daemon_reload: true
